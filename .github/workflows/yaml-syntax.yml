name: YAML syntax

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-syntax:
    name: yaml-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install PyYAML==6.0.3
      - name: Parse tracked YAML without resolving ESPHome tags
        # Syntax only: no secret/include resolution, firmware build or deployment.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"]
          ).decode().split("\0")
          failed = False
          count = 0
          for name in filter(None, paths):
              count += 1
              try:
                  with Path(name).open(encoding="utf-8") as source:
                      for _ in yaml.parse(source):
                          pass
              except (OSError, UnicodeError, yaml.YAMLError):
                  # Never print source text: it may contain credentials.
                  print(f"Invalid YAML: {name}", file=sys.stderr)
                  failed = True
          print(f"Checked {count} tracked YAML files.")
          sys.exit(1 if failed or count == 0 else 0)
          PY
