# XIAO ESP32-C3 Technibel Piste A soldered reference firmware.

esphome:
  name: ir-technibel-clim-piste-a
  friendly_name: Clim Séjour IR Piste A
  includes:
    - ./libraries/technibel_ir.h
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino
    log_level: INFO

logger:
  level: DEBUG
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: send_command
      variables:
        mode: string      # COOL | DRY | FAN | AUTO | OFF
        consigne: int     # 16–30
        fan: string       # AUTO | 1 | 2 | 3 | 4 | 5 | 6
        t_amb: int        # 15–40, from the remote/HA room sensor
      then:
        - lambda: |-
            bool power = true;
            TechnibelMode m = TechnibelMode::COOL;
            if      (mode == "OFF")  { power = false; }
            else if (mode == "DRY")  { m = TechnibelMode::DRY; }
            else if (mode == "FAN")  { m = TechnibelMode::FAN; }
            else if (mode == "AUTO") { m = TechnibelMode::AUTO; }

            TechnibelFan f = TechnibelFan::FAN_AUTO;
            if      (fan == "1" || fan == "LOW")  { f = TechnibelFan::FAN_1; }
            else if (fan == "2")                  { f = TechnibelFan::FAN_2; }
            else if (fan == "3" || fan == "MED")  { f = TechnibelFan::FAN_3; }
            else if (fan == "4")                  { f = TechnibelFan::FAN_4; }
            else if (fan == "5")                  { f = TechnibelFan::FAN_5; }
            else if (fan == "6" || fan == "HIGH") { f = TechnibelFan::FAN_6; }

            uint8_t temp = (uint8_t)std::max((int32_t)16, std::min((int32_t)30, (int32_t)consigne));
            uint8_t amb  = (uint8_t)std::max((int32_t)15, std::min((int32_t)40, (int32_t)t_amb));
            auto raw = technibel_build_raw(m, temp, f, power, amb);
            auto call = id(ir_tx).transmit();
            auto* data = call.get_data();
            data->set_carrier_frequency(38000);
            for (auto value : raw) {
              if (value > 0) data->mark(value);
              else data->space(-value);
            }
            call.perform();
            ESP_LOGI("technibel", "IR sent: mode=%s temp=%d fan=%s amb=%d power=%s",
              mode.c_str(), (int)temp, fan.c_str(), (int)amb, power ? "ON" : "OFF");

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Paris
    servers:
      - 162.159.200.1
      - 216.239.35.0
      - pool.ntp.org

remote_transmitter:
  id: ir_tx
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: false
  rmt_symbols: 96
