# ──────────────────────────────────────────────────────────────────────────────
# ir-clim-sniffer.yaml
# ESPHome — récepteur IR pour capture de trames Technibel (phase reverse engineering)
# GPIO23 ← KY-022 / VS1838B (38kHz IR receiver) OUT
#
# Usage : brancher le récepteur IR face à la télécommande Technibel,
# observer les logs ESPHome (niveau DEBUG), appuyer sur les touches.
# Les trames Pronto brutes apparaissent dans les logs.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: ir-clim-sniffer
  friendly_name: Clim Sniffer IR

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

time:
  - platform: sntp
    id: sniffer_time
    timezone: Europe/Paris
    servers:
      - 162.159.200.1
      - 216.239.35.0
      - pool.ntp.org

text_sensor:
  - platform: template
    id: last_capture
    name: "Dernière capture IR"
    icon: "mdi:remote"
    entity_category: diagnostic
    update_interval: never

ota:
  - platform: esphome
    password: !secret ota_password

remote_receiver:
  pin:
    number: GPIO23
    inverted: true
  dump: all
  tolerance: 25%
  filter: 50µs
  idle: 4ms
  on_raw:
    - text_sensor.template.publish:
        id: last_capture
        state: !lambda |-
          auto now = id(sniffer_time).now();
          std::string timestamp = now.is_valid()
            ? now.strftime("%Y-%m-%d %H:%M:%S")
            : std::string("time-unsynchronized");
          return timestamp + " | n_sym=" + std::to_string(x.size());
    - homeassistant.event:
        event: esphome.technibel_ir_capture
        data:
          captured_at: !lambda |-
            return id(sniffer_time).now().strftime("%Y-%m-%dT%H:%M:%S%z");
          symbol_count: !lambda |-
            return (int) x.size();
          raw: !lambda |-
            std::string result;
            for (size_t i = 0; i < x.size(); i++) {
              if (i != 0) result += ",";
              result += std::to_string(x[i]);
            }
            return result;
