# Bare XIAO ESP32-C3 validation firmware.
# Phase 2 adds a visible LED on GPIO3 (D1); remove the output/interval blocks
# after Gatekeeper 2 before moving to the transistor/IR phases.

esphome:
  name: ir-technibel-clim-min
  friendly_name: Clim Séjour IR Min
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino
    log_level: INFO

logger:
  level: DEBUG
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Paris
    servers:
      - 162.159.200.1
      - 216.239.35.0
      - pool.ntp.org

# Phase 2: GPIO3/D1 -> 330 ohm -> LED anode; LED cathode -> GND.
switch:
  - platform: gpio
    pin: GPIO3
    id: test_gpio
    restore_mode: ALWAYS_OFF

interval:
  - interval: 500ms
    then:
      - switch.toggle: test_gpio
