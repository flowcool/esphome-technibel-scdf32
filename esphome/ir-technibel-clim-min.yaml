# XIAO ESP32-C3 IR transmitter validation firmware.
# Phase 7 replaces the Phase 2 GPIO toggle with a 38 kHz NEC test transmitter.

esphome:
  name: ir-technibel-clim-min
  friendly_name: Clim Séjour IR Min
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino
    log_level: INFO

logger:
  level: DEBUG
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: test_nec
      then:
        - remote_transmitter.transmit_nec:
            address: 0x1234
            command: 0x5678

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Paris
    servers:
      - 162.159.200.1
      - 216.239.35.0
      - pool.ntp.org

remote_transmitter:
  id: ir_tx
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: false
  rmt_symbols: 96
